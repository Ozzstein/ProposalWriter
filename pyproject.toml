[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proposal-agency"
version = "0.1.0"
description = "Agentic grant-proposal writing agency built on the Claude Agent SDK"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "claude-agent-sdk>=0.2.140",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "jsonschema>=4.20",
    "typer>=0.12",
    "httpx>=0.27",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
connectors = [
    "fastmcp>=3.0",
]

[project.scripts]
agency = "agency.cli:app"

[tool.setuptools.packages.find]
include = ["agency*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
